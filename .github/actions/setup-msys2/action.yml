name: Set up MSYS2
description: Install the MSYS2 toolchain and the libraries VerseLens builds against.

inputs:
  extra-packages:
    description: Additional MSYS2 packages, separated by spaces.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        # git is not on the minimal PATH of the MSYS2 shell, CMake needs it for the commit hash
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-catch
          mingw-w64-ucrt-x86_64-cppwinrt
          mingw-w64-ucrt-x86_64-curl
          mingw-w64-ucrt-x86_64-libzip
          mingw-w64-ucrt-x86_64-lua54
          mingw-w64-ucrt-x86_64-pugixml
          mingw-w64-ucrt-x86_64-sol2
          mingw-w64-ucrt-x86_64-spdlog
          mingw-w64-ucrt-x86_64-sqlite3
          mingw-w64-ucrt-x86_64-tesseract-ocr
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-declarative
          mingw-w64-ucrt-x86_64-qt6-svg
          ${{ inputs.extra-packages }}
