name: Build
description: Configure, build, test and install VerseLens with MSYS2, then check that the installed executable starts.

runs:
  using: composite
  steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        # git is not on the minimal PATH of the MSYS2 shell, CMake needs it for the commit hash
        install: >-
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-catch
          mingw-w64-x86_64-cppwinrt
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-libzip
          mingw-w64-x86_64-lua54
          mingw-w64-x86_64-pugixml
          mingw-w64-x86_64-sol2
          mingw-w64-x86_64-spdlog
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-tesseract-ocr
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-qt6-svg

    # The MSYS2 git refuses the checkout of the runner's git as not owned by the user
    - name: Configure
      shell: msys2 {0}
      run: |
        git config --global --add safe.directory '*'
        cmake --preset gcc-release

    - name: Build
      shell: msys2 {0}
      run: cmake --build --preset gcc-release

    - name: Test
      shell: msys2 {0}
      run: ctest --preset gcc-release

    - name: Install
      shell: msys2 {0}
      run: cmake --install build

    # Runs outside of MSYS2, so a dll that is only found on its PATH fails here.
    # The install hook exits before the window opens, a missing dll or a crashing hook does not.
    - name: Check the installed executable starts
      shell: pwsh
      run: |
        $process = Start-Process -FilePath build/install/bin/verselens.exe -ArgumentList '--veloapp-install', '0.0.0' -PassThru
        if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'verselens.exe did not exit within 60 seconds' }
        if ($process.ExitCode -ne 0) { throw "verselens.exe exited with $($process.ExitCode)" }
